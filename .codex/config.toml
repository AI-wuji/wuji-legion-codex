# The host selects the concrete model for the current Codex/ChatGPT account.
# Legion controls reasoning effort and never forces a model ID here.
model_reasoning_effort = "medium"
model_auto_compact_token_limit = 90000
model_auto_compact_token_limit_scope = "body_after_prefix"
tool_output_token_limit = 6000

[history]
max_bytes = 1048576

[agents]
max_threads = 6
max_depth = 1
